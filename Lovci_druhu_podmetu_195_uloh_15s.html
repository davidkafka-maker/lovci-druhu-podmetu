<script>
const BANKS=[[{"id": "1-1", "section": 1, "text": "Za poslední zatáčkou se náhle objevil **vlak**.", "answer": "Holý", "explanation": "vlak"}, {"id": "1-2", "section": 1, "text": "**Jeho nečekaný návrat** všechny přítomné zaskočil.", "answer": "Rozvitý", "explanation": "Jeho nečekaný návrat"}, {"id": "1-3", "section": 1, "text": "Přes veškeré naše námitky **ona** na svém rozhodnutí trvala.", "answer": "Holý", "explanation": "ona"}, {"id": "1-4", "section": 1, "text": "Na stole zůstala ležet **kniha bez obálky**.", "answer": "Rozvitý", "explanation": "kniha bez obálky"}, {"id": "1-5", "section": 1, "text": "**Čekat** už nemělo smysl.", "answer": "Holý", "explanation": "Čekat"}, {"id": "1-6", "section": 1, "text": "**Někdo z přítomných** musel o celé události vědět.", "answer": "Rozvitý", "explanation": "Někdo z přítomných"}, {"id": "1-7", "section": 1, "text": "Po několika hodinách usilovného pátrání se **pohřešovaný** konečně našel.", "answer": "Holý", "explanation": "pohřešovaný"}, {"id": "1-8", "section": 1, "text": "**Člověk s obavami z každé změny** se novému prostředí přizpůsobuje obtížně.", "answer": "Rozvitý", "explanation": "Člověk s obavami z každé změny"}, {"id": "1-9", "section": 1, "text": "V jeho hlase zaznívala **nejistota**.", "answer": "Holý", "explanation": "nejistota"}, {"id": "1-10", "section": 1, "text": "**Pomáhat druhým** nemusí být vždy snadné.", "answer": "Rozvitý", "explanation": "Pomáhat druhým"}, {"id": "1-11", "section": 1, "text": "Z celého jeho vyprávění nás nejvíce zaujalo **závěrečné přiznání**.", "answer": "Rozvitý", "explanation": "závěrečné přiznání"}, {"id": "1-12", "section": 1, "text": "**Nikdo** se k odpovědnosti za vzniklou škodu nepřihlásil.", "answer": "Holý", "explanation": "Nikdo"}, {"id": "1-13", "section": 1, "text": "**Ti odvážnější** se vydali na cestu ještě před svítáním.", "answer": "Rozvitý", "explanation": "Ti odvážnější"}, {"id": "1-14", "section": 1, "text": "Za takových okolností by **mlčet** znamenalo souhlasit "id": "1-28", "section": 1, "text": "**Vítěz** si po skončení závodu dlouho nemohl vzpomenout na své první dojmy.", "answer": "Holý", "explanation": "Vítěz"}, {"id": "1-29", "section": 1, "text": "**První** už dávno dorazil do cíle.", "answer": "Holý", "explanation": "První"}, {"id": "1-30", "section": 1, "text": "Nad jeho jednáním se pozastavil i **někdo tak zkušený**.", "answer": "Rozvitý", "explanation": "někdo tak zkušený"}], [{"id": "2-1", "section": 2, "text": "Po zveřejnění výsledků přibylo stížností.", "answer": "Genitivní", "explanation": "stížností"}, {"id": "2-2", "section": 2, "text": "V nádrži během suchého léta ubylo vody.", "answer": "Genitivní", "explanation": "vody"}, {"id": "2-3", "section": 2, "text": "S blížícím se termínem přibývalo nervozity.", "answer": "Genitivní", "explanation": "nervozity"}, {"id": "2-4", "section": 2, "text": "Po změně jízdního řádu ubylo večerních spojů.", "answer": "Genitivní", "explanation": "večerních spojů"}, {"id": "2-5", "section": 2, "text": "V posledních letech přibylo zahraničních návštěvníků.", "answer": "Genitivní", "explanation": "zahraničních návštěvníků"}, {"id": "2-6", "section": 2, "text": "Po jeho vysvětlení ubylo pochybností.", "answer": "Genitivní", "explanation": "pochybností"}, {"id": "2-7", "section": 2, "text": "Na obloze postupně přibývalo tmavých mraků.", "answer": "Genitivní", "explanation": "tmavých mraků"}, {"id": "2-8", "section": 2, "text": "Během dlouhého výstupu nám ubývalo sil.", "answer": "Genitivní", "explanation": "sil"}, {"id": "2-9", "section": 2, "text": "V diskusi přibylo věcných připomínek.", "answer": "Genitivní", "explanation": "věcných připomínek"}, {"id": "2-10", "section": 2, "text": "Po opravě potrubí ubylo poruch.", "answer": "Genitivní", "explanation": "poruch"}, {"id": "2-11", "section": 2, "text": "S každým dalším svědectvím přibývalo důkazů.", "answer": "Genitivní", "explanation": "důkazů"}, {"id": "2-12", "section": 2, "text": "Z krajiny postupně ubývalo zeleně.", "answer": "Genitivní", "explanation": "zeleně"}, {"id": "2-13", "section": 2, "text": "Za zavřenými dveřmi něco zašustilo.", "answer": "Neurčitý", "explanation": "něco"}, {"id": "2-14", "section": 2, "text": "V hodinách to náhle hrklo.", "answer": "Neurčitý", "explanation": "to"}, {"id": "2-15", "section": 2, "text": "Pod hladinou se cosi pohnulo.", "answer": "Neurčitý", "explanation": "cosi"}, {"id": "2-16", "section": 2, "text": "V motoru to při rozjezdu zarachotilo.", "answer": "Neurčitý", "explanation": "to"}, {"id": "2-17", "section": 2, "text": "Na půdě něco zapraskalo.", "answer": "Neurčitý", "explanation": "něco"}, {"id": "2-18", "section": 2, "text": "V husté mlze se cosi zablesklo.", "answer": "Neurčitý", "explanation": "cosi"}, {"id": "2-19", "section": 2, "text": "Pod podlahou to několikrát zadunělo.", "answer": "Neurčitý", "explanation": "to"}, {"id": "2-20", "section": 2, "text": "V křoví se něco zatřepotalo.", "answer": "Neurčitý", "explanation": "něco"}, {"id": "2-21", "section": 2, "text": "Za stěnou to tiše zaškrábalo.", "answer": "Neurčitý", "explanation": "to"}, {"id": "2-22", "section": 2, "text": "V dálce cosi temně hučelo.", "answer": "Neurčitý", "explanation": "cosi"}, {"id": "2-23", "section": 2, "text": "Uvnitř přístroje něco pravidelně cvakalo.", "answer": "Neurčitý", "explanation": "něco"}, {"id": "2-24", "section": 2, "text": "Ve starém potrubí to hlasitě zabublalo.", "answer": "Neurčitý", "explanation": "to"}, {"id": "2-25", "section": 2, "text": "S takovým řešením zásadně nesouhlasím.", "answer": "Nevyjádřený", "explanation": "já"}, {"id": "2-26", "section": 2, "text": "O celé záležitosti jsme dlouho přemýšleli.", "answer": "Nevyjádřený", "explanation": "my"}, {"id": "2-27", "section": 2, "text": "Proč ses k té poznámce stále vracel?", "answer": "Nevyjádřený", "explanation": "ty"}, {"id": "2-28", "section": 2, "text": "Přinesli jste všechny potřebné podklady?", "answer": "Nevyjádřený", "explanation": "vy"}, {"id": "2-29", "section": 2, "text": "Neodcházej před koncem představení.", "answer": "Nevyjádřený", "explanation": "ty"}, {"id": "2-30", "section": 2, "text": "Zkontrolujme ještě poslední odstavec.", "answer": "Nevyjádřený", "explanation": "my"}, {"id": "2-31", "section": 2, "text": "Eva si přečetla celý dopis. **Potom jej beze slova odložila.**", "answer": "Nevyjádřený", "explanation": "ona — Eva"}, {"id": "2-32", "section": 2, "text": "Turisté dorazili k rozcestníku. **Po krátké poradě pokračovali na sever.**", "answer": "Nevyjádřený", "explanation": "oni — turisté"}, {"id": "2-33", "section": 2, "text": "Dítě se probudilo ještě před svítáním. **Za chvíli však znovu usnulo.**", "answer": "Nevyjádřený", "explanation": "ono — dítě"}, {"id": "2-34", "section": 2, "text": "Obě sestry nabídku odmítly. **Později svého rozhodnutí litovaly.**", "answer": "Nevyjádřený", "explanation": "ony — sestry"}, {"id": "2-35", "section": 2, "text": "Petr se zastavil před zamčenou bránou. **Marně hledal klíč v kapsách.**", "answer": "Nevyjádřený", "explanation": "on — Petr"}, {"id": "2-36", "section": 2, "text": "O takové možnosti jsem dosud neslyšel.", "answer": "Nevyjádřený", "explanation": "já"}, {"id": "2-38", "section": 2, "text": "Darovanému koni na zuby nehleď.", "answer": "Všeobecný", "explanation": "lidé obecně; obecné ponaučení, nikoli konkrétní osoba"}, {"id": "2-39", "section": 2, "text": "Neříkej hop, dokud nepřeskočíš.", "answer": "Všeobecný", "explanation": "lidé obecně; obecné ponaučení, nikoli konkrétní osoba"}, {"id": "2-40", "section": 2, "text": "S poctivostí nejdál dojdeš.", "answer": "Všeobecný", "explanation": "kdokoli, lidé obecně; nejde o konkrétního adresáta"}, {"id": "2-42", "section": 2, "text": "Dvakrát měř, jednou řež.", "answer": "Všeobecný", "explanation": "lidé obecně; obecné ponaučení, nikoli konkrétní osoba"}, {"id": "2-43", "section": 2, "text": "Co můžeš udělat dnes, neodkládej na zítřek.", "answer": "Všeobecný", "explanation": "lidé obecně; obecné ponaučení, nikoli konkrétní osoba"}, {"id": "2-44", "section": 2, "text": "Jak si usteleš, tak si lehneš.", "answer": "Všeobecný", "explanation": "lidé obecně; obecné ponaučení, nikoli konkrétní osoba"}, {"id": "2-45", "section": 2, "text": "Za peníze si skutečné přátelství nekoupíš.", "answer": "Všeobecný", "explanation": "lidé obecně; obecné ponaučení, nikoli konkrétní osoba"}, {"id": "2-48", "section": 2, "text": "Do stejné řeky dvakrát nevstoupíš.", "answer": "Všeobecný", "explanation": "lidé obecně; obecné ponaučení, nikoli konkrétní osoba"}, {"id": "2-49", "section": 2, "text": "Od rána vytrvale prší.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-50", "section": 2, "text": "Nad horami se už stmívá.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-51", "section": 2, "text": "V noci silně mrzlo.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-52", "section": 2, "text": "Za oknem hustě sněžilo.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-53", "section": 2, "text": "Nad vzdáleným lesem se blýskalo.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-54", "section": 2, "text": "Před pátou hodinou už svítalo.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-55", "section": 2, "text": "Po dlouhé cestě mi bylo nevolno.", "answer": "Bez podmětu", "explanation": "tělesný stav"}, {"id": "2-56", "section": 2, "text": "Při polykání mě bolelo v krku.", "answer": "Bez podmětu", "explanation": "tělesný pocit"}, {"id": "2-57", "section": 2, "text": "Po té zprávě se mu ulevilo.", "answer": "Bez podmětu", "explanation": "změna stavu"}, {"id": "2-58", "section": 2, "text": "Stýskalo se jí po domově.", "answer": "Bez podmětu", "explanation": "duševní stav"}, {"id": "2-59", "section": 2, "text": "V přeplněné místnosti se mi špatně dýchalo.", "answer": "Bez podmětu", "explanation": "tělesný stav"}, {"id": "2-60", "section": 2, "text": "Po celodenní práci se mi chtělo spát.", "answer": "Bez podmětu", "explanation": "tělesný stav"}, {"id": "2-61", "section": 2, "text": "Celou noc lilo jako z konve.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-62", "section": 2, "text": "Nad údolím se postupně vyjasňovalo.", "answer": "Bez podmětu", "explanation": "přírodní děj"}, {"id": "2-63", "section": 2, "text": "K večeru se výrazně ochladilo.", "answer": "Bez podmětu", "explanation": "změna teploty"}, {"id": "2-64", "section": 2, "text": "V nevytopené místnosti bylo chladno.", "answer": "Bez podmětu", "explanation": "stav prostředí"}, {"id": "2-65", "section": 2, "text": "Na chodbě bylo po vyučování ticho.", "answer": "Bez podmětu", "explanation": "stav prostředí"}, {"id": "2-66", "section": 2, "text": "Po několika soustech se mi udělalo špatně.", "answer": "Bez podmětu", "explanation": "tělesný stav"}, {"id": "2-68", "section": 2, "text": "Po běhu mě píchalo v boku.", "answer": "Bez podmětu", "explanation": "tělesný pocit"}, {"id": "2-69", "section": 2, "text": "Z té představy mi bylo úzko.", "answer": "Bez podmětu", "explanation": "duševní stav"}, {"id": "2-70", "section": 2, "text": "Na výletě se nám líbilo.", "answer": "Bez podmětu", "explanation": "hodnocení prožitku"}, {"id": "2-71", "section": 2, "text": "O výsledku dosud nebylo rozhodnuto.", "answer": "Bez podmětu", "explanation": "neosobní pasivní konstrukce"}, {"id": "2-72", "section": 2, "text": "Do budovy bylo vniknuto násilím.", "answer": "Bez podmětu", "explanation": "neosobní pasivní konstrukce"}, {"id": "2-73", "section": 2, "text": "S jeho návrhem nebylo počítáno.", "answer": "Bez podmětu", "explanation": "neosobní pasivní konstrukce"}, {"id": "2-74", "section": 2, "text": "Na upozornění nebylo včas reagováno.", "answer": "Bez podmětu", "explanation": "neosobní pasivní konstrukce"}, {"id": "2-75", "section": 2, "text": "O podmínkách smlouvy bylo jednáno celé dopoledne.", "answer": "Bez podmětu", "explanation": "neosobní pasivní konstrukce"}, {"id": "2-76", "section": 2, "te , {"id": "3-55", "section": 3, "text": "Po dlouhém zapírání mu nakonec připadalo snazší promluvit.", "answer": "promluvit", "kind": "Infinitivní", "answerIndex": 7}, {"id": "3-56", "section": 3, "text": "Po zavedení kontrol krádeží v okolí výrazně ubylo.", "answer": "krádeží", "kind": "Partitivní", "answerIndex": 3}, {"id": "3-57", "section": 3, "text": "Cosi v dálce za lesem temně hučelo.", "answer": "Cosi", "kind": "Neurčitý", "answerIndex": 0}, {"id": "3-58", "section": 3, "text": "Na takovou možnost jsi upozornil právě ty.", "answer": "ty", "kind": "Zájmenný", "answerIndex": 6}, {"id": "3-59", "section": 3, "text": "Po prvním kole zůstalo ve hře deset.", "answer": "deset", "kind": "Číslovkový", "answerIndex": 6}, {"id": "3-60", "section": 3, "text": "Převzetí zásilky si nechal od adresáta písemně potvrdit kurýr.", "answer": "kurýr", "kind": "Podstatné jméno", "answerIndex": 8}]];
const SHEET_ID="1pkj1ISkzdtgNphGLGwakezT1WzHJxz-pv2OLnCmfnLk";
const GAS_WEB_APP_URL="https://script.google.com/macros/s/AKfycbzrwi1N_f2ddRf2XsOLBtDEFmcxAdWPpW170_dtGNSXUl8vejZl1dhxkqMYhjdxVs8u/exec";
const RESULTS_SHEET_URL="https://docs.google.com/spreadsheets/d/1pkj1ISkzdtgNphGLGwakezT1WzHJxz-pv2OLnCmfnLk/edit?usp=sharing";
const TIME_LIMIT=15,TEST_COUNT=20,CHALLENGE_TARGET=20;
const SECTION_LABELS=['HOLÝ × ROZVITÝ','DRUH PODMĚTU','NAJDI PODMĚT'];
const OPTIONS=[['Holý','Rozvitý'],['Genitivní','Neurčitý','Nevyjádřený','Všeobecný','Bez podmětu','Několikanásobný']];
const app=document.getElementById('app');
let state={screen:'home',mode:null,name:'',clazz:'',pool:[],index:0,score:0,correct:0,wrong:0,streak:0,timer:null,pending:null,locked:false,cheated:false,finishSent:false,restart:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function marked(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong class="subject">$1</strong>')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectRound(){return BANKS.flatMap((b,i)=>shuffle(b).slice(0,[4,8,8][i]))}
function clearTimer(){clearInterval(state.timer);state.timer=null}
function clearPending(){clearTimeout(state.pending);state.pending=null}
function render(h,mode=state.mode){document.body.className=mode?'mode-'+mode:'';app.innerHTML=h+(state.screen!=='question'&&!h.includes('VÝSLEDKOVÁ TABULKA')?`<div class="row"><a class="btn ghost" href="${RESULTS_SHEET_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div>`:'');document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions[b.dataset.act]())}
function home(){clearTimer();clearPending();state.screen='home';state.mode=null;render(`<div class="card"><h1 class="title">Lovci druhů podmětu</h1><p class="subtitle">Poznej podmět a jeho druh. Tři sekce, dvacet úloh.<br><strong>Verze: 195 úloh • 15 sekund na odpověď</strong></p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button></div><div class="row"><a class="btn ghost" href="${RESULTS_SHEET_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div><p class="small">Každé kolo: 4 úlohy holý × rozvitý, 8 úloh na druh podmětu, 8 úloh na nalezení podmětu.<br>VÝZVA: všech 20 správně za sebou = jednička. Chyba či vypršení času spustí nové kolo.<br>TEST: 20 úloh, každá za 1 bod. Čas: ${TIME_LIMIT} s na úlohu.</p><table class="resultTable"><tr><th>Body v testu</th><th>Známka</th></tr><tr><td>20–18</td><td>1</td></tr><tr><td>17–16</td><td>2</td></tr><tr><td>15–14</td><td>3</td></tr><tr><td>13–12</td><td>4</td></tr><tr><td>11–0</td><td>5</td></tr></table><p class="small">Během hry zůstaň na této stránce. Opuštění aktivního okna ukončí pokus se známkou 6.<br>Databáze: 30 + 105 + 60 = 195 úloh.</p></div>`,null)}
function nameScreen(mode){clearPending();state.mode=mode;state.screen='name';render(`<div class="card"><h1 class="title">${mode==='challenge'?'VÝZVA':'TEST'}</h1><div class="nameBox"><input class="input" id="name" autocomplete="name" placeholder="Jméno žáka" aria-label="Jméno žáka"><input class="input" id="clazz" placeholder="Třída" aria-label="Třída"><button class="btn ${mode==='challenge'?'challengeBtn':'testBtn'}" id="start">ZAČÍT</button><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div></div>`);document.getElementById('start').onclick=()=>{const name=document.getElementById('name').value.trim(),clazz=document.getElementById('clazz').value.trim();if(!name||!clazz){alert('Vyplň jméno i třídu.');return}state.name=name;state.clazz=clazz;unlockAudio();start(mode)}}
function start(mode){clearTimer();clearPending();state={...state,screen:'question',mode,pool:selectRound(),index:0,score:0,correct:0,wrong:0,streak:0,locked:false,cheated:false,finishSent:false,restart:false};next()}
function next(){clearTimer();clearPending();if(state.index>=20)return finish();state.screen='question';state.current=state.pool[state.index];state.locked=false;renderQuestion();startTimer()}
function renderQuestion(){const q=state.current;let question,choices='';if(q.section===3){question=q.text.split(/\s+/).map((word,i)=>`<button class="wordBtn" data-word="${i}" aria-label="${esc(word)}">${esc(word)}</button>`).join(' ')}else{question=esc(q.text.replace(/\*\*/g,''));choices=`<div class="choiceGrid ${q.section===2?'types':''}">${OPTIONS[q.section-1].map(x=>`<button class="choiceBtn" data-choice="${esc(x)}">${esc(x.toUpperCase())}</button>`).join('')}</div>`}const prompt=q.section===1?'Rozhodni, zda je podmět ve větě holý, nebo rozvitý.':q.section===2?(q.text.includes('**')?'Urči typ podmětu ve druhé větě.':'Urči typ podmětu, nebo zvol BEZ PODMĚTU.'):'Klikni na slovo, které je ve větě podmětem.';
render(`<div class="card"><div class="topbar"><div class="seal ${state.mode==='challenge'?'challengeSeal':'testSeal'}">${state.mode==='challenge'?'VÝZVA':'TEST'}</div><div class="timeCenter"><span id="time">${TIME_LIMIT}</span><span class="status">ÚLOHA ${state.index+1}/20 • ${state.mode==='test'?'BODY '+state.score:'SÉRIE '+state.streak}/20</span></div><div class="seal sectionSeal">${SECTION_LABELS[q.section-1]}</div></div><div class="prompt">${prompt}</div><div class="question ${q.section===3?'words':''}">${question}</div>${choices}<div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="nextRow"></div><div class="small"><a href="#" data-act="home" style="color:var(--muted)">Hlavní menu</a></div></div>`);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(b.dataset.choice,b));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.word),b))}
function markAnswers(selected){const q=state.current;document.querySelectorAll('[data-choice],[data-word]').forEach(b=>{b.disabled=true;const good=q.section===3?Number(b.dataset.word)===q.answerIndex:b.dataset.choice===q.answer;if(good)b.classList.add('correct');else if(b===selected)b.classList.add('wrong')})}
function answer(value,button){if(state.locked||state.screen!=='question')return;handleAnswer(state.current.section===3?value===state.current.answerIndex:value===state.current.answer,button,false)}
function timeout(){if(!state.locked&&state.screen==='question')handleAnswer(false,null,true)}
function handleAnswer(good,button,expired){state.locked=true;clearTimer();markAnswers(button);const q=state.current;let fb;if(good){state.correct++;state.score++;state.streak++;fb='<span class="ok">SPRÁVNĚ! +1 BOD</span>';soundCorrect()}else{state.wrong++;state.streak=0;state.restart=state.mode==='challenge';fb=`<span class="bad">${expired?'ČAS VYPRŠEL':'CHYBA'}${state.restart?' — VÝZVA ZAČÍNÁ ZNOVU':''}</span><br><span class="small">Správně: ${esc(q.answer)}${q.explanation?' • '+esc(q.explanation):''}</span>`;soundWrong()}document.getElementById('fb').innerHTML=fb;state.index++;document.getElementById('nextRow').innerHTML=`<button class="btn ghost" data-act="next">${state.restart?'NOVÁ VÝZVA':state.index===20?'VÝSLEDEK':'DALŠÍ'}</button>`;document.querySelector('[data-act="next"]').onclick=advance;state.pending=setTimeout(advance,good?750:5000)}
function advance(){if(!state.locked||state.screen!=='question')return;clearPending();if(state.restart){state.pool=selectRound();state.index=0;state.score=0;state.streak=0;state.restart=false}next()}
function startTimer(){state.deadline=Date.now()+TIME_LIMIT*1000;updateTime();state.timer=setInterval(()=>{updateTime();if(Date.now()>=state.deadline){clearTimer();timeout()}},100)}
function updateTime(){const e=document.getElementById('time');if(e)e.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function grade(s){return s>=18?1:s>=16?2:s>=14?3:s>=12?4:5}
function finish(){clearTimer();clearPending();state.screen='finish';const z=state.mode==='challenge'?1:grade(state.score);render(`<div class="card"><h1 class="title">${state.mode==='challenge'?'VÝZVA SPLNĚNA':'VÝSLEDEK'}</h1><div class="result"><b>${esc(state.name)}</b> • ${esc(state.clazz)}<br><b>Body:</b> ${state.score}/20<br><b>Známka:</b> ${z}${state.mode==='challenge'?'<br>Všech 20 odpovědí za sebou správně!':''}</div><div class="sendStatus" id="sendStatus"></div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`);sendResult(z,state.mode==='challenge'?'VÝZVA':'TEST')}
function buildPayload(z,kind){return {timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:state.mode,oddil:'druhy podmětu',body:state.score,celkem:20,spravne:state.correct,spatne:state.wrong,poznamka:state.cheated?kind:kind,sheetId:SHEET_ID,app:'Lovci druhů podmětu'}}
function sendResult(z,kind,urgent=false){if(state.finishSent)return;state.finishSent=true;const params=new URLSearchParams();Object.entries(buildPayload(z,kind)).forEach(([k,v])=>params.append(k,String(v??'')));try{if(urgent&&navigator.sendBeacon){navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([params.toString()],{type:'application/x-www-form-urlencoded'}))}else fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),keepalive:true}).then(()=>{const e=document.getElementById('sendStatus');if(e)e.textContent='Výsledek byl odeslán. Zápis ověř ve výsledkové tabulce.'}).catch(()=>{const e=document.getElementById('sendStatus');if(e)e.textContent='Výsledek se nepodařilo odeslat. Poznamenej si body a známku.'})}catch(e){}}
function activeProtected(){return ['test','challenge'].includes(state.mode)&&state.screen==='question'}
function cheatFinish(reason){if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen='finish';clearTimer();clearPending();soundCheat();sendResult(6,'PODVOD: '+reason,true);render(`<div class="card cheat"><h1 class="title">POKUS UKONČEN</h1><div class="result">Došlo k opuštění aktivního okna.<br><b>Známka: 6</b></div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`)}
let audioCtx=null;function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur,gain=.08,type='sine',delay=0){try{unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function soundCorrect(){tone(720,.08,.06);tone(980,.10,.05,'sine',.07)}function soundWrong(){tone(150,.20,.22,'square');tone(110,.23,.20,'sawtooth',.17)}function soundCheat(){tone(95,.65,.28,'sawtooth');tone(70,.65,.24,'square',.35)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cheatFinish('přepnutí mimo stránku')});window.addEventListener('pagehide',()=>cheatFinish('opuštění stránky'));window.addEventListener('beforeunload',e=>{if(activeProtected()){e.preventDefault();e.returnValue=''}});window.addEventListener('blur',()=>setTimeout(()=>{if(activeProtected()&&document.visibilityState==='visible'&&!document.hasFocus())cheatFinish('ztráta aktivního okna')},650));
const actions={home,nameChallenge:()=>nameScreen('challenge'),nameTest:()=>nameScreen('test'),next:advance};home();
</script></body></html>
